name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend — tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vetclinic
          POSTGRES_PASSWORD: vetclinic
          POSTGRES_DB: vetclinic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vetclinic"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://vetclinic:vetclinic@127.0.0.1:5432/vetclinic?schema=public
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_ROOT_USER: ci-placeholder
      MINIO_ROOT_PASSWORD: ci-placeholder
    defaults:
      run:
        working-directory: vetclinic-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vetclinic-backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run build

  flutter:
    name: Flutter — analyse et tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vetclinic_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
