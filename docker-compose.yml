version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: vetclinic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vetclinic
      POSTGRES_PASSWORD: REDACTED_DB_PASSWORD
      POSTGRES_DB: vetclinic
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: vetclinic-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: REDACTED_MINIO_USER
      MINIO_ROOT_PASSWORD: REDACTED_MINIO_PASSWORD
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
