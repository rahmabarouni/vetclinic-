# Les identifiants ne sont PAS stockés ici.
# Copiez .env.example vers .env (fichier ignoré par git) et renseignez
# des valeurs fortes. Docker Compose lit automatiquement ce .env.
services:
  postgres:
    image: postgres:16-alpine
    container_name: vetclinic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vetclinic}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant - definissez-le dans .env (voir .env.example)}"
      POSTGRES_DB: ${POSTGRES_DB:-vetclinic}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: vetclinic-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER manquant - definissez-le dans .env (voir .env.example)}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD manquant - definissez-le dans .env (voir .env.example)}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
